[project]
name = "todo-llm-service"
version = "0.1.0"
description = "FastAPI service integrating an OpenAI-compatible LLM to manage a to-do list"
authors = [{name = "Your Name"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "SQLAlchemy>=2.0.25",
    "openai>=1.12.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.30",
]

[project.optional-dependencies]
development = [
    "pytest>=8.0.0",
]
futureagi = [
    "futureagi>=0.6.7",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
